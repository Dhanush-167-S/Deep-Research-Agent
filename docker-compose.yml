version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: topresearch_db
    environment:
      POSTGRES_USER: topresearch
      POSTGRES_PASSWORD: topresearch_pass
      POSTGRES_DB: topresearch_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topresearch -d topresearch_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

